<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F3ED" />
    <title>NearMe is offline</title>
    <style>
      /* Static fallback shown only if the app shell itself cannot be served. No external assets. */
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f3ed; color: #252b26; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
      svg { width: 72px; height: 72px; }
      h1 { margin: 1.5rem 0 0.5rem; font: 500 2rem/1.1 ui-serif, Georgia, serif; letter-spacing: -0.02em; }
      p { margin: 0 0 1.5rem; color: #6c6f68; }
      a { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 12px; background: #252b26; color: #f5f3ed; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9.5" fill="#252B26" /><circle cx="16" cy="16" r="3.5" fill="#E97845" /><path d="M8.2 16A7.8 7.8 0 0 1 16 8.2" stroke="#F5F3ED" stroke-width="2.1" stroke-linecap="round" fill="none" /><path d="M23.8 16A7.8 7.8 0 0 1 16 23.8" stroke="#F5F3ED" stroke-width="2.1" stroke-linecap="round" fill="none" /></svg>
      <h1>You are offline</h1>
      <p>NearMe could not load. Check your connection and try again. Places you saved are available as soon as the app opens.</p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
