name: Deploy to GitHub Pages

# Builds the app on every push to main and publishes the result to the gh-pages branch, which
# GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build for the project sub-path
        run: npm run build:pages
        env:
          # A project site lives at https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Publish dist to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Deploy ${GITHUB_SHA}"
          # One commit, force-pushed: the branch holds only the current build, not its history.
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
